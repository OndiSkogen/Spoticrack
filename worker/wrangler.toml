name = "spoticrack-worker"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Serves the built frontend (npm run build -w frontend) from the same
# Worker as the API - one origin, one deploy, no CORS needed.
[assets]
directory = "../frontend/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "spoticrack-db"
database_id = "c6b8a1f1-1544-4021-81ee-d526b6adbea5"
